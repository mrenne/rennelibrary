<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Renne Library</title>
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Oswald:wght@500;600;700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --paper:      #f3eee2;
      --paper-dark: #e7dfcc;
      --ink:        #1b1915;
      --ink-soft:   #3b372f;
      --ink-faint:  #6b6458;
      --rule:       #1b1915;
      --head:  'Oswald', 'Arial Narrow', sans-serif;
      --body:  'Old Standard TT', Georgia, serif;
      --mast:  'Pirata One', 'Old Standard TT', serif;
    }

    html { scroll-behavior: smooth; }
    body {
      background: #d9d2c1;
      color: var(--ink);
      font-family: var(--body);
      line-height: 1.45;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    /* The sheet of newsprint */
    .sheet {
      max-width: 1320px;
      margin: 0 auto;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.35), transparent 60%),
        radial-gradient(ellipse at 80% 90%, rgba(120,100,60,.08), transparent 55%),
        var(--paper);
      padding: 22px 28px 34px;
      box-shadow: 0 2px 4px rgba(40,30,15,.18), 0 18px 50px rgba(40,30,15,.22);
    }

    a { color: inherit; }

    /* ═════════ MASTHEAD ═════════ */
    .masthead { text-align: center; }
    .mast-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 18px;
    }
    .ear {
      border: 2px solid var(--ink);
      padding: 6px 10px;
      font-family: var(--head);
      text-transform: uppercase;
      font-size: .72rem;
      letter-spacing: .06em;
      line-height: 1.25;
      max-width: 210px;
    }
    .ear.left  { justify-self: start; }
    .ear.right { justify-self: end; text-align: center; }
    .ear .big  { display: block; font-size: 1.5rem; font-weight: 700; letter-spacing: .02em; line-height: 1; }
    .mast-title {
      font-family: var(--mast);
      font-weight: 400;
      font-size: clamp(2.8rem, 8.5vw, 6.6rem);
      line-height: .95;
      letter-spacing: .01em;
      white-space: nowrap;
    }
    .mast-title a { text-decoration: none; }
    .motto {
      font-style: italic;
      font-size: 1rem;
      color: var(--ink-soft);
      margin: 6px 0 8px;
    }
    .dateline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      border-top: 3px double var(--rule);
      border-bottom: 3px double var(--rule);
      padding: 5px 2px;
      font-family: var(--head);
      font-size: .78rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .dateline nav { display: flex; gap: 16px; }
    .dateline nav a { text-decoration: none; border-bottom: 1px solid transparent; }
    .dateline nav a:hover, .dateline nav a.active { border-bottom-color: var(--ink); }

    /* ═════════ BANNER ═════════ */
    .banner {
      text-align: center;
      padding: 12px 0 10px;
      border-bottom: 1px solid var(--rule);
    }
    .banner-kicker {
      font-family: var(--head);
      font-size: .85rem;
      letter-spacing: .3em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .banner h2 {
      font-family: var(--head);
      font-weight: 700;
      text-transform: uppercase;
      line-height: .98;
      letter-spacing: -.005em;
      font-size: clamp(2rem, 6.4vw, 5.2rem);
      cursor: pointer;
    }
    .banner h2.long  { font-size: clamp(1.7rem, 4.8vw, 3.9rem); }
    .banner h2.xlong { font-size: clamp(1.4rem, 3.6vw, 2.9rem); }
    .banner-deck {
      font-family: var(--head);
      font-weight: 500;
      text-transform: uppercase;
      font-size: clamp(1rem, 2vw, 1.5rem);
      letter-spacing: .04em;
      margin-top: 6px;
    }

    /* ═════════ PAGE LAYOUT: section index on the left, one page on the right ═════════ */
    .layout {
      display: grid;
      grid-template-columns: 230px 1fr;
      padding-top: 14px;
    }
    .col-index {
      padding-right: 14px;
      border-right: 1px solid var(--rule);
    }
    .col-index-inner { position: sticky; top: 12px; }
    .view { padding-left: 16px; min-width: 0; }
    .pane[hidden] { display: none; }
    .index-list a.active { font-weight: 700; }
    .index-list a.active .name { text-decoration: underline; }

    /* ═════════ FRONT PAGE GRID ═════════ */
    .front {
      display: grid;
      grid-template-columns: 2.1fr 1.15fr 1.35fr;
      padding: 14px 0 6px;
    }
    .col { padding: 0 14px; border-left: 1px solid var(--rule); min-width: 0; }
    .col:first-child { border-left: none; padding-left: 0; }
    .col:last-child  { padding-right: 0; }

    /* Boxed items, like the paper's sidebars */
    .box {
      border: 2px solid var(--ink);
      padding: 10px 10px 12px;
      margin-bottom: 16px;
    }
    .box-title {
      font-family: var(--head);
      font-weight: 700;
      text-transform: uppercase;
      text-align: center;
      font-size: 1.05rem;
      line-height: 1.1;
      margin-bottom: 8px;
      font-style: italic;
    }
    .index-list { list-style: none; font-size: .92rem; }
    .index-list li a {
      display: flex; align-items: baseline; gap: 4px;
      text-decoration: none; padding: 2px 0;
    }
    .index-list .letter { font-family: var(--head); font-weight: 700; width: 1.1em; }
    .index-list .name { white-space: nowrap; }
    .index-list .dots { flex: 1; border-bottom: 1px dotted var(--ink-faint); transform: translateY(-3px); min-width: 10px; }
    .index-list a:hover .name { text-decoration: underline; }
    .index-total {
      margin-top: 8px; padding-top: 6px;
      border-top: 1px solid var(--rule);
      display: flex; justify-content: space-between;
      font-family: var(--head); text-transform: uppercase; font-size: .8rem; letter-spacing: .06em;
    }

    .search-box label {
      display: block; font-family: var(--head); font-size: .74rem;
      letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; text-align: center;
    }
    .search-box input {
      width: 100%;
      font-family: var(--body); font-size: 1rem;
      padding: 6px 8px;
      background: #fbf8f0;
      border: 1px solid var(--ink);
      border-radius: 0;
      color: var(--ink);
    }
    .search-box input:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
    #search-count { font-size: .85rem; font-style: italic; margin-top: 6px; text-align: center; min-height: 1.2em; }

    /* ═════════ STORIES ═════════ */
    .story { margin-bottom: 18px; }
    .story + .story { border-top: 1px solid var(--rule); padding-top: 12px; }
    .story-kicker {
      font-family: var(--head);
      font-size: .72rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 4px;
    }
    .story-head {
      font-family: var(--head);
      font-weight: 700;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.02;
      font-size: 1.55rem;
      cursor: pointer;
    }
    .story-head:hover { text-decoration: underline; text-decoration-thickness: 2px; }
    .lead .story-head { font-size: clamp(1.8rem, 3vw, 2.6rem); }
    .story-deck {
      font-family: var(--head);
      font-weight: 500;
      text-transform: uppercase;
      text-align: center;
      font-size: .9rem;
      letter-spacing: .04em;
      margin: 6px 0 8px;
      padding: 4px 0;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }
    .story-body {
      font-size: .97rem;
      text-align: justify;
      hyphens: auto;
    }
    .story-body::first-letter {
      font-family: var(--head);
      font-weight: 700;
      font-size: 2.6em;
      float: left;
      line-height: .85;
      padding: 4px 6px 0 0;
    }
    .story-body.pending { color: var(--ink-faint); font-style: italic; }
    .story-body.pending::first-letter { all: unset; }
    .read-more {
      display: inline-block; margin-top: 6px;
      font-family: var(--head); font-size: .74rem; letter-spacing: .1em; text-transform: uppercase;
      background: none; border: none; border-bottom: 1px solid var(--ink); cursor: pointer; color: var(--ink);
    }
    .lead .story-deck { margin-top: 0; }
    .lead .story-body { font-size: 1.02rem; }

    /* Halftone "news photo" */
    .photo { margin: 6px auto 10px; max-width: 220px; text-align: center; }
    .lead .photo { max-width: 260px; }
    .photo-frame {
      position: relative;
      border: 1px solid var(--ink);
      background: var(--paper-dark);
      aspect-ratio: 2 / 3;
      overflow: hidden;
      cursor: pointer;
    }
    .photo-frame img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      filter: grayscale(1) contrast(1.25) brightness(1.04) sepia(.12);
    }
    .photo-frame::after {
      content: '';
      position: absolute; inset: 0;
      background-image: radial-gradient(circle, rgba(0,0,0,.55) 0.9px, transparent 1.3px);
      background-size: 3.2px 3.2px;
      mix-blend-mode: multiply;
      opacity: .38;
      pointer-events: none;
    }
    .photo-frame.missing {
      display: flex; align-items: center; justify-content: center;
      background: repeating-linear-gradient(45deg, var(--paper-dark) 0 6px, var(--paper) 6px 12px);
    }
    .photo-frame.missing::after { display: none; }
    .photo-frame.missing span {
      background: var(--paper); border: 1px solid var(--ink); padding: 6px 8px;
      font-family: var(--head); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase;
    }
    .photo figcaption { font-size: .8rem; font-style: italic; margin-top: 4px; line-height: 1.3; }

    /* ═════════ LATE NEWS ═════════ */
    .late-title {
      font-family: var(--head); font-weight: 700; text-transform: uppercase;
      font-size: 2rem; text-align: center; line-height: 1;
      border: 3px solid var(--ink); outline: 1px solid var(--ink); outline-offset: 2px;
      padding: 6px 4px; margin: 2px 2px 10px;
    }
    .late-sub {
      font-family: var(--head); text-transform: uppercase; text-align: center;
      font-size: .8rem; letter-spacing: .12em; margin-bottom: 8px;
    }
    .late-item { padding: 7px 0; border-top: 1px solid var(--rule); font-size: .92rem; }
    .late-item h5 {
      font-family: var(--head); font-weight: 600; text-transform: uppercase;
      text-align: center; font-size: .86rem; letter-spacing: .03em; margin-bottom: 3px; cursor: pointer;
    }
    .late-item h5:hover { text-decoration: underline; }
    .late-item .dl { font-family: var(--head); font-weight: 600; text-transform: uppercase; font-size: .8rem; letter-spacing: .04em; }

    /* ═════════ SECTIONS ═════════ */
    .paper-section { padding-bottom: 6px; }
    .section-flag {
      display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      font-family: var(--head); text-transform: uppercase; letter-spacing: .1em; font-size: .78rem;
      border-top: 4px solid var(--ink);
      border-bottom: 1px solid var(--rule);
      padding: 4px 0;
    }
    .section-flag a { text-decoration: none; }
    .section-flag a:hover { text-decoration: underline; }
    .section-name {
      font-family: var(--mast);
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      text-align: center; line-height: 1; margin: 10px 0 2px;
      font-weight: 400;
    }
    .section-head {
      font-family: var(--head); font-weight: 700; text-transform: uppercase;
      text-align: center; font-size: clamp(1.3rem, 3vw, 2.2rem); line-height: 1.05;
    }
    .section-deck {
      font-family: var(--head); font-weight: 500; text-transform: uppercase; text-align: center;
      font-size: .92rem; letter-spacing: .04em; margin: 6px auto 14px; max-width: 900px;
    }
    .section-leads {
      display: grid; grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
      padding: 12px 0; margin-bottom: 14px;
    }
    .section-leads .story { margin: 0; padding: 0 14px; border-left: 1px solid var(--rule); border-top: none; }
    .section-leads .story:first-child { border-left: none; padding-left: 0; }
    .section-leads .story:last-child  { padding-right: 0; }

    /* Agate listing — every title in the section, in fine print */
    .agate-title {
      font-family: var(--head); font-weight: 700; text-transform: uppercase; font-style: italic;
      text-align: center; font-size: 1.05rem; margin-bottom: 8px;
    }
    .agate {
      list-style: none;
      column-width: 15.5rem;
      column-gap: 22px;
      column-rule: 1px solid var(--rule);
      font-size: .84rem;
      line-height: 1.3;
    }
    .agate li { break-inside: avoid; padding: 2px 0 3px; }
    .agate li button {
      all: unset; cursor: pointer; display: block; width: 100%;
    }
    .agate li button:hover .t, .agate li button:focus-visible .t { text-decoration: underline; }
    .agate li button:focus-visible { outline: 1px dotted var(--ink); }
    .agate .a { font-variant: small-caps; letter-spacing: .02em; }
    .agate .t { font-style: italic; }
    .agate li[hidden] { display: none; }

    /* Search mode: show only matching listings */
    body.searching .section-leads,
    body.searching .section-deck { display: none; }
    body.searching .paper-section { padding-top: 0; margin-bottom: 18px; }
    .paper-section[hidden] { display: none; }

    .status-msg {
      text-align: center; font-style: italic; padding: 60px 20px; font-size: 1.1rem;
    }
    .status-msg.error { color: #8a2a1a; }

    footer {
      text-align: center; font-family: var(--head); text-transform: uppercase;
      letter-spacing: .12em; font-size: .7rem; margin-top: 16px; color: var(--ink-soft);
    }
    .sync-note { font-family: var(--body); text-transform: none; letter-spacing: 0; font-style: italic; font-size: .82rem; margin-top: 4px; }

    /* ═════════ BOOK MODAL (a clipping) ═════════ */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(30,25,15,.55);
      z-index: 1000; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .clipping {
      background: var(--paper);
      max-width: 760px; width: 100%;
      max-height: 90vh; overflow-y: auto;
      padding: 22px 24px 24px;
      border: 1px solid var(--ink);
      box-shadow: 0 20px 60px rgba(20,15,5,.5);
      position: relative;
    }
    .clip-close {
      position: absolute; top: 8px; right: 10px;
      background: none; border: 1px solid var(--ink); width: 30px; height: 30px;
      font-size: 1rem; cursor: pointer; color: var(--ink); font-family: var(--head);
    }
    .clip-close:hover { background: var(--ink); color: var(--paper); }
    .clip-grid { display: grid; grid-template-columns: 200px 1fr; gap: 20px; }
    .clip-grid .photo { margin: 0; max-width: none; }
    .clip-meta {
      font-family: var(--head); text-transform: uppercase; font-size: .76rem; letter-spacing: .08em;
      border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 4px 0; margin: 8px 0 10px;
      display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
    }
    .clipping .story-head { cursor: default; }
    .clipping .story-head:hover { text-decoration: none; }
    .clipping .story-body { font-size: 1.02rem; }

    /* ═════════ RESPONSIVE ═════════ */
    @media (max-width: 1050px) {
      .layout { grid-template-columns: 200px 1fr; }
      .front { grid-template-columns: 1fr 1fr; row-gap: 18px; }
      .col { padding: 0 12px; }
      .col-lead { grid-column: 1 / -1; border-left: none; padding: 0 0 14px; border-bottom: 1px solid var(--rule); }
      .col-second { border-left: none; padding-left: 0; }
      .section-leads { grid-template-columns: 1fr 1fr; }
      .section-leads .story:nth-child(3) { display: none; }
    }
    @media (max-width: 720px) {
      body { padding: 0; }
      .sheet { padding: 14px 16px 26px; box-shadow: none; }
      .mast-row { grid-template-columns: 1fr; }
      .ear { display: none; }
      .dateline { justify-content: center; text-align: center; }
      .layout { grid-template-columns: 1fr; }
      .col-index { border-right: none; padding-right: 0; }
      .col-index-inner { position: static; }
      .index-list { column-count: 2; column-gap: 14px; }
      .index-list li { break-inside: avoid; }
      .view { padding-left: 0; border-top: 3px double var(--rule); }
      .front { grid-template-columns: 1fr; }
      .col { border-left: none; padding: 14px 0 0; border-top: 1px solid var(--rule); }
      .col-lead { border-top: none; padding-top: 0; border-bottom: none; }
      .photo, .lead .photo { max-width: 200px; }
      .lead .story-body { column-count: 1; }
      .section-leads { grid-template-columns: 1fr; }
      .section-leads .story:nth-child(3) { display: block; }
      .section-leads .story { border-left: none; padding: 0; }
      .section-leads .story + .story { border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 12px; }
      .clip-grid { grid-template-columns: 1fr; }
      .clip-grid .photo { max-width: 200px; margin: 0 auto; }
    }
  </style>
</head>
<body>
  <div class="sheet">

    <!-- ═════════ MASTHEAD ═════════ -->
    <header class="masthead">
      <div class="mast-row">
        <div class="ear left">“All the Books<br>That Are Fit to Read”</div>
        <h1 class="mast-title"><a href="index.html">The Renne Library</a></h1>
        <div class="ear right"><span class="big">COMPLETE</span>EDITION</div>
      </div>
      <p class="motto">&ldquo;The mind once enlightened cannot again become dark.&rdquo; &mdash; Thomas Paine</p>
      <div class="dateline">
        <span id="dl-vol">Vol. I &mdash; No. &hellip;</span>
        <span>Cogito, ergo sum</span>
        <span id="dl-date"></span>
        <nav>
          <a class="active" href="index.html">Front Page</a>
          <a href="authors.html">Authors</a>
        </nav>
        <span>Price: Free</span>
      </div>
    </header>

    <main id="paper">
      <div class="status-msg">Setting type&hellip; consulting the catalog.</div>
    </main>

    <footer>
      Printed from the shelves of The Renne Library
      <div class="sync-note" id="sync-note"></div>
    </footer>
  </div>

  <!-- ═════════ BOOK CLIPPING MODAL ═════════ -->
  <div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="clip-title">
    <article class="clipping">
      <button class="clip-close" id="clip-close" aria-label="Close">✕</button>
      <div class="clip-grid">
        <div id="clip-photo"></div>
        <div>
          <p class="story-kicker" id="clip-kicker"></p>
          <h3 class="story-head" id="clip-title"></h3>
          <div class="clip-meta" id="clip-meta"></div>
          <p class="story-body pending" id="clip-body"></p>
        </div>
      </div>
    </article>
  </div>

  <script>
  (() => {
    'use strict';

    // ═════════════════════════════════════════
    // CONFIGURATION
    // The Google Sheet, published as CSV (File → Share → Publish to web → CSV).
    // Columns used: title, first_name, last_name, genre, ISBN
    // ═════════════════════════════════════════
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS9_PYVb-qMGrPLPsUz6Phg6tpbIquYMHrY-c4jNWD7BQ0hawPWx8NjwGGv0byFClwlFrDgihLPQzGX/pub?gid=673406086&single=true&output=csv';

    // Optional: a Google Books API key (free, from console.cloud.google.com → APIs → Books API).
    // Without one, Google Books shares a public daily quota that is often used up.
    // Restrict the key to your site's address (HTTP referrer) since it is visible in this page.
    const GOOGLE_BOOKS_KEY = '';

    const BOOKS_KEY = 'rl_paper_books_v1';
    const META_KEY  = 'rl_paper_meta_v1';
    const UNSORTED  = 'Miscellany';

    // Editorial order of sections; any new genre typed in the sheet is appended alphabetically.
    const SECTION_ORDER = [
      'Fiction', 'Fantasy', 'Science Fiction', 'History', 'Biography', 'Politics', 'Economics',
      'Philosophy', 'Religion', 'Science', 'Technology', 'Nature', 'Travel', 'Education',
      'Music', 'Humor', 'Reference',
    ];
    // Genre names are matched without regard to capitalization or extra spaces,
    // so "HIstory" or "science  fiction" land in the right section.
    function canonicalGenre(raw) {
      const g = (raw ?? '').replace(/\s+/g, ' ').trim();
      if (!g) return '';
      const known = SECTION_ORDER.find(k => k.toLowerCase() === g.toLowerCase());
      if (known) return known;
      return g.toLowerCase().replace(/(^|[\s\-\/&])([a-z])/g, (m, p, c) => p + c.toUpperCase());
    }
    const HEADLINE_NOUN = {
      'Fiction': 'Works of Fiction', 'Fantasy': 'Fantasy Volumes', 'Science Fiction': 'Science Fiction Volumes',
      'History': 'Histories', 'Biography': 'Biographies', 'Politics': 'Political Volumes',
      'Philosophy': 'Works of Philosophy', 'Religion': 'Volumes on Religion', 'Science': 'Science Volumes',
      'Technology': 'Technology Volumes', 'Nature': 'Nature Volumes', 'Education': 'Volumes on Education',
      'Music': 'Music Volumes', 'Humor': 'Volumes of Humor', 'Reference': 'Reference Volumes',
      'Economics': 'Volumes on Economics', 'Travel': 'Travel Volumes',
    };
    const HEADLINE_VERBS = [
      'Accounted For in Shelf Census', 'Stand Ready on the Shelves', 'Entered Into the Record',
      'Held in the Stacks', 'Reported on Hand',
    ];

    // ═════════════════════════════════════════
    // HELPERS
    // ═════════════════════════════════════════
    const esc = s => String(s ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const $ = id => document.getElementById(id);
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    const authorOf = b => [b.first, b.last].filter(Boolean).join(' ').replace(/\s+/g, ' ').trim();
    const sortKey  = b => `${(b.last || b.first || '').toLowerCase()} ${b.title.toLowerCase()}`;

    // Shorter title for headlines: drop parentheticals and subtitles
    function headTitle(t) {
      let s = t.replace(/\s*\([^)]*\)\s*/g, ' ').replace(/\s*\[[^\]]*\]\s*/g, ' ');
      const colon = s.indexOf(':');
      if (colon > 3) s = s.slice(0, colon);
      return s.replace(/\s+/g, ' ').trim() || t;
    }

    // Day-stable pseudo-random choice
    const DAY = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000);
    function hash(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
      return h >>> 0;
    }
    function dailyPicks(arr, n, salt) {
      return arr
        .map(x => ({ x, k: hash(`${DAY}|${salt}|${x.title}|${x.last}`) }))
        .sort((a, b) => a.k - b.k)
        .slice(0, n)
        .map(o => o.x);
    }

    function toRoman(n) {
      const map = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
      let out = '';
      for (const [v, r] of map) while (n >= v) { out += r; n -= v; }
      return out;
    }

    // ═════════════════════════════════════════
    // CSV (handles quoted fields containing commas, quotes and line breaks)
    // ═════════════════════════════════════════
    function parseCSV(text) {
      const records = [];
      let row = [], field = '', inQ = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQ) {
          if (c === '"') {
            if (text[i + 1] === '"') { field += '"'; i++; }
            else inQ = false;
          } else field += c;
        } else if (c === '"') inQ = true;
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n' || c === '\r') {
          if (c === '\r' && text[i + 1] === '\n') i++;
          row.push(field); records.push(row); row = []; field = '';
        } else field += c;
      }
      if (field || row.length) { row.push(field); records.push(row); }
      return records;
    }

    function booksFromCSV(text) {
      const rec = parseCSV(text.replace(/^﻿/, ''));
      if (rec.length < 2) return [];
      const h = rec[0].map(x => x.trim().toLowerCase().replace(/[\s-]+/g, '_'));
      const col = name => h.indexOf(name);
      const ti = col('title'), fi = col('first_name'), li = col('last_name'), gi = col('genre'), ii = col('isbn');
      const ci = col('cover_url') >= 0 ? col('cover_url') : col('cover');
      if (ti < 0) return [];
      const clean = s => (s ?? '').replace(/\s+/g, ' ').trim();
      // cover_url: a web address (https://…) or a path to an image in the site, e.g. covers/9780.jpg
      const coverOf = s => {
        const v = (s ?? '').trim();
        return /^https?:\/\/\S+$/i.test(v) || /^[\w\-./]+\.(jpe?g|png|webp|gif)$/i.test(v) ? v : '';
      };
      return rec.slice(1).flatMap((r, n) => {
        const title = clean(r[ti]);
        if (!title) return [];
        return [{
          title,
          first: fi >= 0 ? clean(r[fi]) : '',
          last:  li >= 0 ? clean(r[li]) : '',
          genre: gi >= 0 ? canonicalGenre(r[gi]) : '',
          isbn:  ii >= 0 ? clean(r[ii]).replace(/[^0-9Xx]/g, '') : '',
          coverUrl: ci >= 0 ? coverOf(r[ci]) : '',
          row: n,
        }];
      });
    }

    async function fetchSheet() {
      // A unique query string sidesteps Google's cached copy of the published sheet
      const fresh = SHEET_URL + (SHEET_URL.includes('?') ? '&' : '?') + 't=' + Date.now();
      const urls = [fresh, `https://corsproxy.io/?${encodeURIComponent(fresh)}`];
      for (const url of urls) {
        try {
          const r = await fetch(url, { cache: 'no-store' });
          if (!r.ok) continue;
          const text = await r.text();
          if (text.trimStart().startsWith('<')) continue;
          const books = booksFromCSV(text);
          if (books.length) return books;
        } catch (_) { /* try next */ }
      }
      throw new Error('The catalog spreadsheet could not be reached.');
    }

    // ═════════════════════════════════════════
    // BOOK DETAILS — covers & synopses
    // Cover lookup order:
    //   1. the sheet's cover_url column
    //   2. Open Library: this edition's cover, then a cover from any other edition of the work
    //   3. Google Books, by ISBN
    //   Books without an ISBN: Open Library search, then Google Books search, by title + author
    // ═════════════════════════════════════════
    const RECHECK_MS = 14 * 86400000;          // look again for a missing cover after two weeks
    let metaCache = {};
    try { metaCache = JSON.parse(localStorage.getItem(META_KEY) || '{}'); } catch (_) {}
    function saveMeta() { try { localStorage.setItem(META_KEY, JSON.stringify(metaCache)); } catch (_) {} }

    const metaKey  = b => b.isbn || `${b.title}|${b.last}`.toLowerCase();
    const olCover  = id => `https://covers.openlibrary.org/b/id/${id}-M.jpg`;
    const firstId  = ids => (ids || []).find(id => id > 0);

    function cleanDesc(d) {
      let s = typeof d === 'string' ? d : (d?.value ?? '');
      s = s.split(/\n-{3,}|\n\*{3,}|\(\[source\]/)[0];
      s = s.replace(/<[^>]+>/g, ' ').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
           .replace(/\r/g, '').replace(/\n{2,}/g, '\n').replace(/[ \t]{2,}/g, ' ').trim();
      return s;
    }

    // "not found" is an answer worth remembering; any other failure is not
    async function getJSON(url) {
      const r = await fetch(url);
      if (r.status === 404) return null;
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }

    // Guards title searches against grabbing a different book
    const words = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9 ]+/g, ' ').split(/\s+/).filter(w => w && !['the', 'a', 'an', 'and', 'of'].includes(w));
    function titleMatches(b, found) {
      const want = words(headTitle(b.title)).slice(0, 3);
      const have = new Set(words(found));
      return want.length > 0 && want.every(w => have.has(w));
    }

    function gbImage(item) {
      const l = item?.volumeInfo?.imageLinks;
      const u = l?.thumbnail || l?.smallThumbnail || '';
      return u.replace(/^http:/, 'https:').replace(/&edge=curl/, '');
    }
    async function googleBooks(b) {
      const q = b.isbn
        ? `isbn:${b.isbn}`
        : `intitle:${headTitle(b.title)}${b.last ? ` inauthor:${b.last}` : ''}`;
      const key = GOOGLE_BOOKS_KEY ? `&key=${encodeURIComponent(GOOGLE_BOOKS_KEY)}` : '';
      const j = await getJSON(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=5&printType=books${key}`);
      const items = (j?.items || []).filter(i => b.isbn || titleMatches(b, i.volumeInfo?.title));
      const pick = items.find(i => gbImage(i)) || items[0];
      return { cover: gbImage(pick), desc: cleanDesc(pick?.volumeInfo?.description) };
    }

    // Open Library catalog search by title + author; returns the best matching work
    async function olSearch(b) {
      const q = new URLSearchParams({ title: headTitle(b.title), limit: '5', fields: 'key,title,cover_i' });
      if (b.last) q.set('author', b.last);
      const s = await getJSON(`https://openlibrary.org/search.json?${q}`);
      const docs = (s?.docs || []).filter(d => titleMatches(b, d.title));
      return docs.find(d => d.cover_i) || docs[0] || null;
    }

    async function lookupMeta(b) {
      let desc = '', cover = '', workKey = '', partial = false;
      if (b.isbn) {
        const ed = await getJSON(`https://openlibrary.org/isbn/${b.isbn}.json`);
        if (ed) {
          desc = cleanDesc(ed.description);
          const id = firstId(ed.covers);
          if (id) cover = olCover(id);
          workKey = ed.works?.[0]?.key || '';
        }
      }
      if (!workKey) {
        const hit = await olSearch(b);
        if (hit) { workKey = hit.key; if (!cover && hit.cover_i) cover = olCover(hit.cover_i); }
      }
      if (workKey && (!desc || !cover)) {
        const w = await getJSON(`https://openlibrary.org${workKey}.json`);
        if (w) {
          if (!desc) desc = cleanDesc(w.description);
          if (!cover) { const id = firstId(w.covers); if (id) cover = olCover(id); }
        }
      }
      if (!cover && b.isbn) {
        // this edition and its work have no cover: try other catalog records of the same book
        const hit = await olSearch(b);
        if (hit?.cover_i) cover = olCover(hit.cover_i);
      }
      if (!cover || !desc) {
        try {
          const g = await googleBooks(b);
          if (!cover) cover = g.cover;
          if (!desc) desc = g.desc;
        } catch (_) {
          partial = true;   // Google Books refused or failed: look again soon rather than in two weeks
        }
      }
      return { desc, cover, partial };
    }

    // simple serial queue so we stay polite to the APIs
    let qChain = Promise.resolve();
    function queued(fn) {
      const p = qChain.then(fn, fn);
      qChain = p.then(() => sleep(250), () => sleep(250));
      return p;
    }

    const inflight = new Map();
    function getMeta(b) {
      const key = metaKey(b);
      const hit = metaCache[key];
      if (hit && (hit.c || Date.now() - hit.t < RECHECK_MS)) return Promise.resolve({ desc: hit.d, cover: hit.c });
      if (inflight.has(key)) return inflight.get(key);
      const p = queued(() => lookupMeta(b))
        .then(m => {
          // a lookup Google Books couldn't finish is retried after a day instead of two weeks
          const t = m.partial && !m.cover ? Date.now() - RECHECK_MS + 86400000 : Date.now();
          metaCache[key] = { d: m.desc, c: m.cover, t };
          saveMeta();
          return m;
        })
        .catch(() => hit ? { desc: hit.d, cover: hit.c } : { desc: '', cover: '' })   // network trouble: try again next visit
        .finally(() => inflight.delete(key));
      inflight.set(key, p);
      return p;
    }

    function resolveCover(b, skipSheet = false) {
      if (b.coverUrl && !skipSheet) return Promise.resolve(b.coverUrl);
      return getMeta(b).then(m => m.cover);
    }

    function showCover(frame, b, url) {
      frame.classList.remove('pending');
      if (!url) {
        frame.classList.add('missing');
        frame.innerHTML = '<span>No photograph on file</span>';
        return;
      }
      const img = new Image();
      img.alt = `Cover of ${b.title}`;
      img.onerror = () => {
        // a broken link in the sheet falls back to the automatic lookup
        if (url === b.coverUrl) resolveCover(b, true).then(u => showCover(frame, b, u === url ? '' : u));
        else showCover(frame, b, '');
      };
      img.src = url;
      frame.innerHTML = '';
      frame.appendChild(img);
    }

    function fillCovers(root) {
      root.querySelectorAll('[data-cover]').forEach(frame => {
        if (frame.dataset.loaded) return;
        frame.dataset.loaded = '1';
        const b = BOOKS[+frame.dataset.cover];
        resolveCover(b).then(url => showCover(frame, b, url));
      });
    }

    function noSynopsisText(b) {
      return `The archives hold no published summary of “${headTitle(b.title)}.” ` +
             `The volume${authorOf(b) ? `, by ${authorOf(b)},` : ''} is held in the ${b.genre || UNSORTED} section of the collection.`;
    }

    // ═════════════════════════════════════════
    // RENDERING
    // ═════════════════════════════════════════
    let BOOKS = [];
    let SECTIONS = [];   // [{ name, letter, id, books }]

    function groupSections(books) {
      const map = new Map();
      books.forEach(b => {
        const g = b.genre || UNSORTED;
        if (!map.has(g)) map.set(g, []);
        map.get(g).push(b);
      });
      const known = SECTION_ORDER.filter(g => map.has(g));
      const extra = [...map.keys()].filter(g => !SECTION_ORDER.includes(g) && g !== UNSORTED).sort();
      const names = [...known, ...extra, ...(map.has(UNSORTED) ? [UNSORTED] : [])];
      return names.map((name, i) => ({
        name,
        letter: String.fromCharCode(66 + i),          // A is the front page
        id: 'sec-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
        books: map.get(name).slice().sort((a, b) => sortKey(a).localeCompare(sortKey(b))),
      }));
    }

    function photoHTML(b, caption = true) {
      const idx = BOOKS.indexOf(b);
      const frame = `<div class="photo-frame pending" data-open="${idx}" data-cover="${idx}"></div>`;
      return `<figure class="photo">${frame}${caption ? `<figcaption>${esc(headTitle(b.title))}${authorOf(b) ? ` &mdash; ${esc(authorOf(b))}` : ''}</figcaption>` : ''}</figure>`;
    }

    function storyHTML(b, { kicker, lead = false, max } = {}) {
      const idx = BOOKS.indexOf(b);
      return `
        <article class="story${lead ? ' lead' : ''}">
          ${kicker ? `<p class="story-kicker">${esc(kicker)}</p>` : ''}
          ${lead ? '' : `<h3 class="story-head" data-open="${idx}">${esc(headTitle(b.title))}</h3>`}
          <p class="story-deck">${authorOf(b) ? `By ${esc(authorOf(b))}` : 'Author Unrecorded'}</p>
          ${photoHTML(b, false)}
          <p class="story-body pending" data-syn="${idx}" data-max="${max ?? (lead ? 900 : 520)}">Awaiting dispatch from the archives&hellip;</p>
          <button class="read-more" data-open="${idx}">Continued &raquo;</button>
        </article>`;
    }

    function fillSynopses(root) {
      root.querySelectorAll('[data-syn]').forEach(el => {
        if (el.dataset.loaded) return;
        el.dataset.loaded = '1';
        const b = BOOKS[+el.dataset.syn];
        const max = +el.dataset.max || 600;
        getMeta(b).then(({ desc: text }) => {
          let t = text || noSynopsisText(b);
          if (t.length > max) t = t.slice(0, max).replace(/\s+\S*$/, '') + '…';
          el.textContent = t;
          el.classList.remove('pending');
        });
      });
    }

    function render() {
      SECTIONS = groupSections(BOOKS);
      const total = BOOKS.length;
      const withIsbn = BOOKS.filter(b => b.isbn);
      const pool = withIsbn.length ? withIsbn : BOOKS;

      $('dl-vol').innerHTML = `Vol. ${toRoman(SECTIONS.length)} &mdash; No. ${total.toLocaleString()}`;

      // Front-page picks: one banner book, two more from other sections
      const [banner] = dailyPicks(pool, 1, 'banner');
      const others = dailyPicks(pool.filter(b => (b.genre || UNSORTED) !== (banner.genre || UNSORTED)), 40, 'second');
      const second = [];
      for (const b of others) {
        if (second.length === 2) break;
        if (!second.some(s => (s.genre || UNSORTED) === (b.genre || UNSORTED))) second.push(b);
      }
      const late = BOOKS.slice(-6).reverse();

      const bannerTitle = headTitle(banner.title);
      const bannerCls = bannerTitle.length > 42 ? 'xlong' : bannerTitle.length > 24 ? 'long' : '';
      const secOf = name => SECTIONS.find(s => s.name === name);

      const indexRows = `
        <li><a href="#front" data-route="front">
          <span class="letter">A</span><span class="name">Front Page</span>
          <span class="dots"></span><span></span>
        </a></li>` + SECTIONS.map(s => `
        <li><a href="#${s.id}" data-route="${s.id}">
          <span class="letter">${s.letter}</span><span class="name">${esc(s.name)}</span>
          <span class="dots"></span><span>${s.books.length}</span>
        </a></li>`).join('');

      const LATE_PHRASES = [
        (by, l) => `${by} has been added to the collection and placed in Section ${l}.`,
        (by, l) => `${by} is among the newest arrivals and now stands in Section ${l}.`,
        (by, l) => `${by} has taken its place on the shelves of Section ${l}.`,
        (by, l) => `${by} was received and catalogued; readers will find it in Section ${l}.`,
      ];
      const lateRows = late.map((b, i) => {
        const by = authorOf(b) ? `A volume by ${esc(authorOf(b))}` : 'A new volume';
        const letter = secOf(b.genre || UNSORTED).letter;
        return `
        <div class="late-item">
          <h5 data-open="${BOOKS.indexOf(b)}">${esc(headTitle(b.title))}.</h5>
          <p><span class="dl">${esc(b.genre || UNSORTED)}</span>&mdash;${LATE_PHRASES[i % LATE_PHRASES.length](by, letter)}</p>
        </div>`;
      }).join('');

      const sectionsHTML = SECTIONS.map((s, i) => {
        const authors = {};
        s.books.forEach(b => { const a = authorOf(b); if (a) authors[a] = (authors[a] || 0) + 1; });
        const top = Object.entries(authors).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).filter(([, n]) => n > 1).slice(0, 3);
        const deck = top.length
          ? `${top[0][0]} leads the section with ${top[0][1]} titles` +
            (top.length > 1 ? `; ${top.slice(1).map(([a, n]) => `${a} (${n})`).join(' and ')} follow` : '') + '.'
          : `${s.books.length} titles from ${Object.keys(authors).length} authors.`;
        const noun = HEADLINE_NOUN[s.name] || `Volumes of ${s.name}`;
        const leadPool = s.books.filter(b => b.isbn);
        const leads = dailyPicks(leadPool.length >= 3 ? leadPool : s.books, 3, s.name);
        const prev = SECTIONS[i - 1], next = SECTIONS[i + 1];

        const agate = s.books.map(b => `
          <li data-s="${esc((b.title + ' ' + authorOf(b)).toLowerCase())}">
            <button data-open="${BOOKS.indexOf(b)}"><span class="t">${esc(b.title)}</span>${authorOf(b) ? ` &mdash; <span class="a">${esc(authorOf(b))}</span>` : ''}</button>
          </li>`).join('');

        return `
          <section class="paper-section pane" id="${s.id}" hidden>
            <div class="section-flag">
              <span>Section ${s.letter}</span>
              <span>${prev ? `<a href="#${prev.id}">&laquo; ${esc(prev.name)}</a> &nbsp;·&nbsp; ` : ''}<a href="#front">Front Page</a>${next ? ` &nbsp;·&nbsp; <a href="#${next.id}">${esc(next.name)} &raquo;</a>` : ''}</span>
              <span>${s.books.length} Volumes</span>
            </div>
            <h2 class="section-name">${esc(s.name)}</h2>
            <p class="section-head">${s.books.length} ${esc(noun)} ${HEADLINE_VERBS[i % HEADLINE_VERBS.length]}</p>
            <p class="section-deck">${esc(deck)}</p>
            <div class="section-leads">${leads.map(b => storyHTML(b)).join('')}</div>
            <h4 class="agate-title">Complete Listing of the ${esc(s.name)} Section</h4>
            <ul class="agate">${agate}</ul>
          </section>`;
      }).join('');

      $('paper').innerHTML = `
       <div class="layout">
        <aside class="col-index">
          <div class="col-index-inner">
            <div class="box">
              <p class="box-title">Sections in Today&rsquo;s Edition</p>
              <ul class="index-list">${indexRows}</ul>
              <div class="index-total"><span>Total Volumes</span><span>${total.toLocaleString()}</span></div>
            </div>
            <div class="box search-box">
              <label for="search">Classified Inquiry</label>
              <input id="search" type="search" placeholder="Title or author…" autocomplete="off">
              <p id="search-count"></p>
            </div>
          </div>
        </aside>

        <div class="view" id="view">
        <div class="pane" id="front">
        <section class="banner">
          <p class="banner-kicker">Today&rsquo;s Featured Volume &bull; From the ${esc(banner.genre || UNSORTED)} Stacks</p>
          <h2 class="${bannerCls}" data-open="${BOOKS.indexOf(banner)}">${esc(bannerTitle)}</h2>
          ${authorOf(banner) ? `<p class="banner-deck">By ${esc(authorOf(banner))}</p>` : ''}
        </section>

        <section class="front">
          <div class="col col-lead">
            ${storyHTML(banner, { kicker: 'Lead Story', lead: true })}
          </div>

          <div class="col col-second">
            ${second.map(b => storyHTML(b, { kicker: `From Section ${secOf(b.genre || UNSORTED).letter} — ${b.genre || UNSORTED}`, max: 260 })).join('')}
          </div>

          <div class="col col-late">
            <p class="late-title">Late News</p>
            <p class="late-sub">Recent Accessions to the Collection</p>
            ${lateRows}
          </div>
        </section>
        </div>

        ${sectionsHTML}
        </div>
       </div>`;

      $('search').addEventListener('input', onSearch);
      applyView(false);
    }

    // ═════════════════════════════════════════
    // ONE PAGE AT A TIME — the hash picks the front page or a section
    // ═════════════════════════════════════════
    let searchQuery = '';
    const currentRoute = () => {
      const h = decodeURIComponent(location.hash.slice(1));
      return h && $(h)?.classList.contains('pane') ? h : 'front';
    };

    function applyView(scroll) {
      const route = currentRoute();
      const panes = document.querySelectorAll('#view > .pane');
      if (searchQuery) {
        panes.forEach(p => { p.hidden = p.id === 'front' || +p.dataset.hits === 0; });
      } else {
        panes.forEach(p => { p.hidden = p.id !== route; });
        const pane = $(route);
        if (pane) { fillCovers(pane); fillSynopses(pane); }
      }
      document.querySelectorAll('.index-list a').forEach(a => {
        a.classList.toggle('active', !searchQuery && a.dataset.route === route);
      });
      if (scroll) {
        const top = $('view').getBoundingClientRect().top + window.scrollY - 8;
        if (window.scrollY > top || window.matchMedia('(max-width: 720px)').matches) {
          window.scrollTo({ top, behavior: 'instant' });
        }
      }
    }

    window.addEventListener('hashchange', () => {
      if (searchQuery) {
        searchQuery = '';
        $('search').value = '';
        $('search-count').textContent = '';
        document.body.classList.remove('searching');
        document.querySelectorAll('.agate li').forEach(li => { li.hidden = false; });
      }
      applyView(true);
    });

    // ═════════════════════════════════════════
    // SEARCH
    // ═════════════════════════════════════════
    let searchTimer = null;
    function onSearch(e) {
      clearTimeout(searchTimer);
      const q = e.target.value.trim().toLowerCase();
      searchTimer = setTimeout(() => {
        searchQuery = q;
        document.body.classList.toggle('searching', !!q);
        let hits = 0;
        document.querySelectorAll('.paper-section').forEach(sec => {
          let n = 0;
          sec.querySelectorAll('.agate li').forEach(li => {
            const show = !q || li.dataset.s.includes(q);
            li.hidden = !show;
            if (show) n++;
          });
          sec.dataset.hits = n;
          hits += n;
        });
        applyView(false);
        $('search-count').textContent = q
          ? (hits ? `${hits} notice${hits === 1 ? '' : 's'} found.` : 'No notices match that inquiry.')
          : '';
      }, 120);
    }

    // ═════════════════════════════════════════
    // CLIPPING MODAL
    // ═════════════════════════════════════════
    function openBook(b) {
      const sec = SECTIONS.find(s => s.name === (b.genre || UNSORTED));
      $('clip-photo').innerHTML = photoHTML(b, false);
      fillCovers($('clip-photo'));
      $('clip-kicker').textContent = `Section ${sec?.letter ?? ''} — ${b.genre || UNSORTED}`;
      $('clip-title').textContent = b.title;
      $('clip-meta').innerHTML =
        `<span>${authorOf(b) ? 'By ' + esc(authorOf(b)) : 'Author unrecorded'}</span>` +
        (b.isbn ? `<span>ISBN ${esc(b.isbn)}</span>` : '');
      const body = $('clip-body');
      body.className = 'story-body pending';
      body.textContent = 'Consulting the archives…';
      $('modal').classList.add('active');
      $('clip-close').focus();
      getMeta(b).then(({ desc: text }) => {
        if (!$('modal').classList.contains('active') || $('clip-title').textContent !== b.title) return;
        body.textContent = text || noSynopsisText(b);
        body.classList.remove('pending');
      });
    }
    function closeBook() { $('modal').classList.remove('active'); }

    document.addEventListener('click', e => {
      const t = e.target.closest('[data-open]');
      if (t && !t.closest('.clipping')) { openBook(BOOKS[+t.dataset.open]); return; }
      if (e.target === $('modal')) closeBook();
    });
    $('clip-close').addEventListener('click', closeBook);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBook(); });

    // ═════════════════════════════════════════
    // BOOT
    // ═════════════════════════════════════════
    $('dl-date').textContent = new Date().toLocaleDateString('en-US',
      { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

    function sig(list) { return list.map(b => `${b.title}|${b.last}|${b.genre}|${b.isbn}|${b.coverUrl || ''}`).join('\n'); }

    async function boot() {
      try {
        const cached = JSON.parse(localStorage.getItem(BOOKS_KEY) || 'null');
        if (Array.isArray(cached) && cached.length) { BOOKS = cached; render(); }
      } catch (_) {}

      try {
        const fresh = await fetchSheet();
        if (sig(fresh) !== sig(BOOKS)) {
          const scrollY = window.scrollY;
          BOOKS = fresh;
          try { localStorage.setItem(BOOKS_KEY, JSON.stringify(fresh)); } catch (_) {}
          render();
          window.scrollTo(0, scrollY);
        }
        $('sync-note').textContent = `Catalog current as of ${new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}.`;
      } catch (err) {
        console.error('[RenneLibrary]', err);
        if (!BOOKS.length) {
          $('paper').innerHTML = `<div class="status-msg error">The presses have stopped: ${esc(err.message)} Check that the Google Sheet is still published to the web as CSV.</div>`;
        } else {
          $('sync-note').textContent = 'Showing the last printed edition; the catalog could not be reached just now.';
        }
      }
    }
    boot();
  })();
  </script>
</body>
</html>
